name: homevoice_google_stt
description: >-
  The phone's own speech recogniser (Google's, on most Android phones), fed
  with audio the app captured through RecognizerIntent.EXTRA_AUDIO_SOURCE,
  so the app keeps the microphone. Android only; HomeVoice's local plugin.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.homevoice.google_stt
        pluginClass: GoogleSttPlugin
