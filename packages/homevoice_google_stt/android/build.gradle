// The standard Flutter plugin layout (flutter create --template=plugin).
// The app's own Android Gradle Plugin and Kotlin versions win when the app
// builds; the versions below are only used if this is built on its own.
group = "com.homevoice.google_stt"
version = "0.1.0"

buildscript {
    ext.kotlin_version = "1.9.24"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.homevoice.google_stt"

    // 33+ for EXTRA_AUDIO_SOURCE and the language-support calls.
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        // The app runs on older phones too; this plugin simply reports
        // "android_too_old" below Android 13 and the app uses Moonshine.
        minSdk = 21
    }
}
