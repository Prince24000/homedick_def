// The standard Flutter plugin layout (flutter create --template=plugin).
// The app's own Android Gradle Plugin and Kotlin versions win when the app
// builds; the versions below are only used if this is built on its own.
group = "com.homevoice.moonshine2"
version = "0.1.0"

buildscript {
    ext.kotlin_version = "1.9.24"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.homevoice.moonshine2"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        // Moonshine's library asks for Android 8 (API 26). THE APP'S OWN
        // minSdk must be 26 or more too, or the build stops at "manifest
        // merger failed" -- see README.
        minSdk = 26
    }
}

dependencies {
    // Moonshine Voice: the newer streaming models (Tiny, Base, Small,
    // Medium), with its own copy of the model runtime. MIT licence.
    implementation("ai.moonshine:moonshine-voice:0.1.5")
}
