# HomeVoice app: build the APK on GitHub.
# Put this file in the repo at .github/workflows/build.yml
# Run it: the repo's Actions tab -> "Build APK" -> Run workflow.
# The APK is under the finished run -> Artifacts -> homevoice-apk.

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.x
          cache: true

      # The speech model files are too big to upload through the website,
      # so the build fetches them (the same files the hub uses).
      - name: Speech models
        run: |
          set -e
          mkdir -p assets/models/moonshine
          if [ ! -f assets/models/moonshine/preprocess.onnx ]; then
            curl -fsSL -o m.tar.bz2 \
              https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-moonshine-base-en-int8.tar.bz2
            tar -xjf m.tar.bz2
            src=sherpa-onnx-moonshine-base-en-int8
            for f in preprocess.onnx encode.int8.onnx uncached_decode.int8.onnx cached_decode.int8.onnx tokens.txt; do
              cp "$src/$f" assets/models/moonshine/
            done
            rm -rf m.tar.bz2 "$src"
          fi
          if [ ! -f assets/models/silero_vad.onnx ]; then
            curl -fsSL -o assets/models/silero_vad.onnx \
              https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          fi
          ls -la assets/models assets/models/moonshine

      # The same signing key every build, so a new APK installs over the
      # last one. Stored in the repo's Secrets as DEBUG_KEYSTORE_BASE64.
      - name: Signing key
        env:
          KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY" ]; then
            mkdir -p ~/.android
            echo "$KEY" | base64 -d > ~/.android/debug.keystore
            echo "signing key restored"
          else
            echo "WARNING: no DEBUG_KEYSTORE_BASE64 secret -- this APK will not install over the last one"
          fi

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: homevoice-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
