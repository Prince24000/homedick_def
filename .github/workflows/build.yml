# HomeVoice app: build the APK on GitHub.
# Put this file in the repo at .github/workflows/build.yml
# Run it: the repo's Actions tab -> "Build APK" -> Run workflow.
# The APK is on the repo's Releases page (newest at the top): HomeVoice.apk (update,
# no speech model inside) or HomeVoice-full.apk ("models" ticked: a phone's first install).

name: Build APK

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Put the speech model inside (only for a phone that never had the app: ~430 MB instead of ~140 MB)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Gradle's big cache on the machine's second disk (/mnt), not the
    # small main one.
    env:
      GRADLE_USER_HOME: /mnt/gradle-home
      # Where Android's build tools look for the signing key: set, so the
      # key restored below is the one used (not a random one of its own).
      ANDROID_USER_HOME: /home/runner/.android
      # The key's fingerprint: every APK must carry exactly this one.
      KEY_SHA256: f774a5aacd063d3b81d0d83023e56d208c6a2c9e8dc8693102f09cac4b2576b9
    steps:
      # GitHub's machine has little free disk; the build (Flutter, Gradle,
      # the speech models) needs more. Tools this build never uses go.
      # (The Android SDK and Java stay.)
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/powershell /usr/share/swift /opt/az \
            /opt/microsoft /opt/google /usr/local/julia* \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy \
            /usr/local/lib/node_modules /usr/local/share/chromium || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          # Private repos get a 7 GB machine; Gradle can want more, and then
          # GitHub kills the run ("canceled"). Extra memory on the second disk.
          sudo fallocate -l 8G /mnt/swapfile && sudo chmod 600 /mnt/swapfile \
            && sudo mkswap /mnt/swapfile >/dev/null && sudo swapon /mnt/swapfile || true
          sudo mkdir -p /mnt/gradle-home && sudo chown -R "$USER" /mnt/gradle-home
          df -h / /mnt
          free -h

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3.38 (Dart 3.10): what the project's packages need, and it still
      # accepts the project's Gradle (8.14). The newest Flutter wants
      # Gradle 9.3.1, so keep this pinned.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.x
          cache: true

      # The speech model files are too big to upload through the website,
      # so the build fetches them (the same files the hub uses).
      - name: Speech models
        run: |
          set -e
          # Every asset folder pubspec.yaml names must exist (GitHub keeps
          # no empty folders, e.g. assets/models/kws): made, with a
          # placeholder the app skips.
          grep -E '^[[:space:]]*-[[:space:]]*assets/.*/[[:space:]]*$' pubspec.yaml \
            | sed -E 's/^[[:space:]]*-[[:space:]]*//; s/[[:space:]]*$//' \
            | while read -r d; do
                mkdir -p "$d"
                [ -n "$(ls -A "$d")" ] || touch "$d/.gitkeep"
              done
          mkdir -p assets/models/moonshine
          # UPDATES leave the speech model out: a phone that had the app
          # already holds it (copied out on first start; an update keeps it).
          # Only a FIRST install on a phone needs it inside.
          if [ "${{ inputs.models }}" = "true" ] && [ ! -f assets/models/moonshine/preprocess.onnx ]; then
            curl -fsSL -o m.tar.bz2 \
              https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-moonshine-base-en-int8.tar.bz2
            tar -xjf m.tar.bz2
            src=sherpa-onnx-moonshine-base-en-int8
            for f in preprocess.onnx encode.int8.onnx uncached_decode.int8.onnx cached_decode.int8.onnx tokens.txt; do
              cp "$src/$f" assets/models/moonshine/
            done
            rm -rf m.tar.bz2 "$src"
          fi
          if [ ! -f assets/models/silero_vad.onnx ]; then
            curl -fsSL -o assets/models/silero_vad.onnx \
              https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          fi
          [ -n "$(ls -A assets/models/moonshine)" ] || touch assets/models/moonshine/.gitkeep
          ls -la assets/models assets/models/moonshine

      # The same signing key every build, so a new APK installs over the
      # last one. Stored in the repo's Secrets as DEBUG_KEYSTORE_BASE64.
      - name: Signing key
        env:
          KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEY" ]; then
            echo "NO SIGNING KEY: add the secret DEBUG_KEYSTORE_BASE64 (Settings > Secrets and variables > Actions)."
            echo "Without it the APK gets a random key and never installs over the last one."
            exit 1
          fi
          mkdir -p "$ANDROID_USER_HOME" ~/.android
          echo "$KEY" | tr -d ' \r\n' | base64 -d > "$ANDROID_USER_HOME/debug.keystore"
          cp "$ANDROID_USER_HOME/debug.keystore" ~/.android/debug.keystore 2>/dev/null || true
          keytool -list -v -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android | grep -i "SHA256:" | head -1
          echo "signing key restored"

      # Left-overs from the laptop (uploaded through the website, which
      # ignores .gitignore) break Gradle's cache: start clean.
      - name: Clean laptop leftovers
        run: |
          rm -rf android/.gradle android/.kotlin android/build android/app/build \
                 android/local.properties android/app/.cxx build .dart_tool
          find android -name "*.lock" -path "*/.gradle/*" -delete 2>/dev/null || true
          # Flutter's default asks Gradle for 8 GB -- more than this machine
          # has, so GitHub kills it. 4 GB, and fewer jobs at once.
          touch android/gradle.properties
          sed -i '/^org.gradle.jvmargs/d; /^org.gradle.workers.max/d' android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
          echo "org.gradle.workers.max=2" >> android/gradle.properties
          cat android/gradle.properties

      - run: flutter pub get

      # One APK for every device: 64-bit ARM (most phones), 32-bit ARM (older
      # and budget / Android Go phones) and x86_64 (some tablets, Chromebooks,
      # emulators such as Waydroid on a PC). Kept the same on every build.
      - run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      # Proves the APK can install before anyone downloads it: signed (an
      # unsigned APK never installs), and which Android versions and chips
      # it takes. Fails here, in plain words, if it is not signed.
      - name: Check the APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -la build/app/outputs/flutter-apk/
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "== signature =="
          if ! "$BT/apksigner" verify --print-certs "$APK" > certs.txt; then
            echo "THE APK IS NOT SIGNED -- it cannot install on any phone."
            exit 1
          fi
          head -3 certs.txt
          if ! grep -qi "SHA-256 digest: $KEY_SHA256" certs.txt; then
            echo "WRONG SIGNING KEY -- this APK would not install over the app. Stopping."
            exit 1
          fi
          echo "signed with YOUR key: it installs over the last one"
          echo "== what it needs =="
          "$BT/aapt2" dump badging "$APK" 2>/dev/null \
            | grep -E "^package:|sdkVersion|native-code" || true

      # The APK itself, on the repo's Releases page: tap it, it downloads
      # as an .apk (no zip to open).
      - name: Name the APK
        run: |
          if [ "${{ inputs.models }}" = "true" ]; then N=HomeVoice-full.apk; else N=HomeVoice.apk; fi
          cp build/app/outputs/flutter-apk/app-release.apk "$N"
          echo "APK=$N" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HomeVoice build ${{ github.run_number }}
          files: ${{ env.APK }}
